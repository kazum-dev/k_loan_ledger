{% extends "base.html" %}

{% block title %}
貸付登録 | K's Loan Ledger
{% endblock %}

{% block content %}

<section class="page-header">
    <p class="page-eyebrow">
        New Loan
    </p>

    <h1>
        貸付登録
    </h1>

    <p class="page-lead">
        顧客・貸付金額・返済条件を入力して貸付を登録します。
    </p>

    <div class="action-group">
        <a
            href="{{ url_for('loan_list') }}"
            class="btn btn-secondary"
        >
            貸付一覧へ戻る
        </a>
    </div>
</section>

<section class="section-block">
    <div class="card form-card">

        {% if errors %}
            <div class="message-error">
                <p>
                    入力内容を確認してください。
                </p>

                <ul>
                    {% for error in errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <form method="POST">
            <div>
                <label for="customer_id">
                    顧客ID
                    <span class="required-label">必須</span>
                </label>

                <input
                    type="text"
                    id="customer_id"
                    name="customer_id"
                    value="{{ form_data.get('customer_id', '') }}"
                    required
                >
            </div>

            <div>
                <label for="loan_amount">
                    貸付額（円）
                    <span class="required-label">必須</span>
                </label>

                <input
                    type="number"
                    id="loan_amount"
                    name="loan_amount"
                    value="{{ form_data.get('loan_amount', '') }}"
                    min="1"
                    step="1"
                    required
                >
            </div>

            <div>
                <label for="loan_date">
                    貸付日
                    <span class="required-label">必須</span>
                </label>

                <input
                    type="date"
                    id="loan_date"
                    name="loan_date"
                    value="{{ form_data.get('loan_date', '') }}"
                    required
                >
            </div>

            <div>
                <label for="due_date">
                    返済期日
                    <span class="required-label">必須</span>
                </label>

                <input
                    type="date"
                    id="due_date"
                    name="due_date"
                    value="{{ form_data.get('due_date', '') }}"
                    required
                >
            </div>

            <div>
                <label for="interest_rate_percent">
                    通常利率（%）
                    <span class="required-label">必須</span>
                </label>

                <input
                    type="number"
                    id="interest_rate_percent"
                    name="interest_rate_percent"
                    value="{{ form_data.get('interest_rate_percent', '10.0') }}"
                    min="0"
                    step="0.1"
                    required
                >
            </div>

            <div>
                <label for="repayment_method">
                    返済方法
                </label>

                <select
                    id="repayment_method"
                    name="repayment_method"
                >
                    <option
                        value="CASH"
                        {% if form_data.get('repayment_method') == 'CASH' %}selected{% endif %}
                    >
                        現金
                    </option>

                    <option
                        value="BANK_TRANSFER"
                        {% if form_data.get('repayment_method') == 'BANK_TRANSFER' %}selected{% endif %}
                    >
                        銀行振込
                    </option>

                    <option
                        value="UNKNOWN"
                        {% if form_data.get('repayment_method', 'UNKNOWN') == 'UNKNOWN' %}selected{% endif %}
                    >
                        不明
                    </option>
                </select>
            </div>

            <div>
                <label for="grace_period_days">
                    延滞猶予日数（日）
                    <span class="required-label">必須</span>
                </label>

                <input
                    type="number"
                    id="grace_period_days"
                    name="grace_period_days"
                    value="{{ form_data.get('grace_period_days', '0') }}"
                    min="0"
                    step="1"
                    required
                >
            </div>

            <div>
                <label for="late_fee_rate_percent">
                    延滞利率（%）
                    <span class="required-label">必須</span>
                </label>

                <input
                    type="number"
                    id="late_fee_rate_percent"
                    name="late_fee_rate_percent"
                    value="{{ form_data.get('late_fee_rate_percent', '10.0') }}"
                    min="0"
                    step="0.1"
                    required
                >
            </div>

            <div>
                <label for="notes">
                    備考
                </label>

                <input
                    type="text"
                    id="notes"
                    name="notes"
                    value="{{ form_data.get('notes', '') }}"
                >
            </div>

            <button
                type="submit"
                class="btn btn-primary"
            >
                貸付を登録
            </button>
        </form>

    </div>
</section>

{% endblock %}
