{% extends "base.html" %}

{% block title %}
返済登録
{% endblock %}

{% block content %}

    <h1>返済登録</h1>

    {% if errors %}
        <ul>
            {% for error in errors %}
                <li style="color: red;">
                    {{ error }}
                </li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="POST">
        <div>
            <label>貸付ID</label>

            <input
                type="text"
                name="loan_id"
                value="{{ form_data.get('loan_id', '') }}"
            >
        </div>

        <div>
            <label>返済金額</label>

            <input
                type="text"
                name="repayment_amount"
                value="{{ form_data.get('repayment_amount', '') }}"
            >
        </div>

        <div>
            <label>返済日</label>

            <input
                type="date"
                name="repayment_date"
                value="{{ form_data.get('repayment_date', '') }}"
            >
        </div>

        <div>
            <label>返済種別</label>

            <select name="payment_type">
                <option
                    value="REPAYMENT"
                    {% if form_data.get('payment_type', 'REPAYMENT') == 'REPAYMENT' %}selected{% endif %}
                >
                    通常返済
                </option>

                <option
                    value="LATE_FEE"
                    {% if form_data.get('payment_type') == 'LATE_FEE' %}selected{% endif %}
                >
                    延滞手数料返済
                </option>
            </select>
        </div>

        <button type="submit">
            返済を登録する
        </button>
    </form>

{% endblock %}
