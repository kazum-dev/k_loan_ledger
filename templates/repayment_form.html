{% extends "base.html" %}

{% block title %}
返済登録 | K's Loan Ledger
{% endblock %}

{% block content %}

<section class="page-header">
    <p class="page-eyebrow">
        New Repayment
    </p>

    <h1>
        返済登録
    </h1>

    <p class="page-lead">
        対象の貸付ID・返済金額・返済種別を入力して返済を登録します。
    </p>

    <div class="action-group">
        <a
            href="{{ url_for('repayment_list') }}"
            class="btn btn-secondary"
        >
            返済一覧へ戻る
        </a>
    </div>
</section>

<section class="section-block">
    <div class="card form-card">

        {% if errors %}
            <div class="message-error">
                <p>
                    入力内容を確認してください。
                </p>

                <ul>
                    {% for error in errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <form method="POST">
            <div>
                <label>
                    貸付ID
                </label>

                <input
                    type="text"
                    name="loan_id"
                    value="{{ form_data.get('loan_id', '') }}"
                >
            </div>

            <div>
                <label>
                    返済金額（円）
                </label>

                <input
                    type="text"
                    name="repayment_amount"
                    value="{{ form_data.get('repayment_amount', '') }}"
                >
            </div>

            <div>
                <label>
                    返済日
                </label>

                <input
                    type="date"
                    name="repayment_date"
                    value="{{ form_data.get('repayment_date', '') }}"
                >
            </div>

            <div>
                <label>
                    返済種別
                </label>

                <select name="payment_type">
                    <option
                        value="REPAYMENT"
                        {% if form_data.get('payment_type', 'REPAYMENT') == 'REPAYMENT' %}selected{% endif %}
                    >
                        通常返済
                    </option>

                    <option
                        value="LATE_FEE"
                        {% if form_data.get('payment_type') == 'LATE_FEE' %}selected{% endif %}
                    >
                        延滞手数料
                    </option>
                </select>
            </div>

            <button
                type="submit"
                class="btn btn-primary"
            >
                返済を登録
            </button>
        </form>

    </div>
</section>

{% endblock %}
