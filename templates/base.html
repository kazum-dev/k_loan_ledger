<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}K's Loan Ledger{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    {% block head %}{% endblock %}
</head>
<body>

    {% if g.user %}
        <header class="site-header">
            <div class="site-header__inner">

                <div class="site-header__top">
                    <a
                        href="{{ url_for('home') }}"
                        class="site-title"
                    >
                        K's Loan Ledger
                    </a>

                    <div class="user-area">
                        <p>
                            ログイン中：
                            {{ g.user.username }}
                        </p>

                        <form
                            method="POST"
                            action="{{ url_for('logout') }}"
                        >
                            <button
                                type="submit"
                                class="btn btn-secondary"
                            >
                                ログアウト
                            </button>
                        </form>
                    </div>
                </div>

                <nav
                    class="site-nav"
                    aria-label="メインナビゲーション"
                >
                    <ul>
                        <li>
                            <a href="{{ url_for('home') }}">
                                トップ
                            </a>
                        </li>

                        <li>
                            <a href="{{ url_for('dashboard') }}">
                                ダッシュボード
                            </a>
                        </li>

                        <li>
                            <a href="{{ url_for('customer_list') }}">
                                顧客
                            </a>
                        </li>

                        <li>
                            <a href="{{ url_for('loan_list') }}">
                                貸付
                            </a>
                        </li>

                        <li>
                            <a href="{{ url_for('repayment_list') }}">
                                返済
                            </a>
                        </li>

                        <li>
                            <a href="{{ url_for('loan_status') }}">
                                未返済・延滞
                            </a>
                        </li>

                        <li>
                            <a href="{{ url_for('loan_contracts') }}">
                                契約管理
                            </a>
                        </li>
                    </ul>
                </nav>

            </div>
        </header>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}

</body>
</html>
