{% extends "base.html" %}

{% block title %}
契約解除登録 | K's Loan Ledger
{% endblock %}

{% block content %}

<section class="page-header">
    <p class="page-eyebrow">
        Cancel Contract
    </p>

    <h1>
        契約解除登録
    </h1>

    <p class="page-lead">
        指定した貸付の契約を解除済みとして登録します。
    </p>

    <div class="action-group">
        <a
            href="{{ url_for('loan_contracts') }}"
            class="btn btn-secondary"
        >
            契約状態管理へ戻る
        </a>
    </div>
</section>

<section class="section-block">
    <div class="card form-card">

        {% if errors %}
            <div class="message-error">
                <p>
                    入力内容を確認してください。
                </p>

                <ul>
                    {% for error in errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <form method="post">
            <div>
                <label for="loan_id">
                    貸付ID
                </label>

                <input
                    type="text"
                    id="loan_id"
                    name="loan_id"
                    value="{{ form_data.get('loan_id', '') }}"
                >
            </div>

            <div>
                <label for="cancel_reason">
                    契約解除理由
                </label>

                <textarea
                    id="cancel_reason"
                    name="cancel_reason"
                    rows="4"
                >{{ form_data.get('cancel_reason', '') }}</textarea>
            </div>

            <button
                type="submit"
                class="btn btn-danger"
            >
                契約解除を登録
            </button>
        </form>

    </div>
</section>

{% endblock %}
