{% extends "base.html" %}

{% block title %}
契約解除登録 | K's Loan Ledger
{% endblock %}

{% block content %}

    <h1>契約解除登録</h1>

    <p>
        指定した貸付IDの契約状態を CANCELLED に更新します。
    </p>

    {% if errors %}
        <div class="message-error">
            <ul>
                {% for error in errors %}
                    <li>
                        {{ error }}
                    </li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="post">
        <div>
            <label for="loan_id">貸付ID</label><br>

            <input
                type="text"
                id="loan_id"
                name="loan_id"
                value="{{ form_data.get('loan_id', '') }}"
            >
        </div>

        <br>

        <div>
            <label for="cancel_reason">
                契約解除理由
            </label><br>

            <textarea
                id="cancel_reason"
                name="cancel_reason"
                rows="4"
                cols="50"
            >{{ form_data.get('cancel_reason', '') }}</textarea>
        </div>

        <br>

        <button type="submit" class="btn btn-danger">
            契約解除を登録する
        </button>
    </form>

{% endblock %}
