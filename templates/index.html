{% extends "base.html" %}

{% block title %}
K's Loan Ledger
{% endblock %}

{% block content %}

    <p>
        顧客・貸付・返済・未返済状況・契約状態を管理するアプリです。
    </p>

    <h2>アプリ概要</h2>

    <p>
        このアプリでは、顧客情報、貸付記録、返済記録を一覧で確認し、
        管理できるようにすることを目的としています。
    </p>

    <h2>データ概要</h2>

    <ul>
        <li>顧客数：{{ customer_count }}</li>
        <li>貸付件数：{{ loan_count }}</li>
        <li>返済件数：{{ repayment_count }}</li>
    </ul>

{% endblock %}
